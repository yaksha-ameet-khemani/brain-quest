<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f0f9ff">
<title>Brain Quest - offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #f0f9ff; color: #1e293b; font-family: system-ui, sans-serif; text-align: center; padding: 16px; }
  h1 { color: #0369a1; font-size: 1.6rem; margin: 0.4em 0; }
  p { color: #475569; max-width: 22rem; margin: 0.4em auto; }
  button { margin-top: 1.2em; border: 0; border-radius: 9999px; background: #0ea5e9; color: #fff;
           font-size: 1rem; font-weight: 600; padding: 0.8em 1.8em; }
</style>
</head>
<body>
<main>
  <div style="font-size:3.5rem">📶</div>
  <h1>No internet right now</h1>
  <p>Brain Quest needs the internet to check your answers and keep your points safe.</p>
  <p>Connect to Wi-Fi or mobile data, then try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
